<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tom的作品集</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <h1>Tom的作品集</h1>
    <p class="intro">北京化工大学・生物工程，在学习大模型</p>
  </header>

  <main class="container">
    <section class="card about-card">
      <img class="avatar" src="photo.jpg" alt="Tom">
      <div class="about-info">
        <h2>关于我</h2>
        <p class="about-name">Tom</p>
        <p class="about-school">北京化工大学・生物工程专业</p>
        <p class="about-desc">正在学习大模型，探索 AI 与生物的交叉</p>
      </div>
    </section>

    <section class="card">
      <h2>学习记录</h2>

      <h3 class="sub-title">时间线</h3>
      <ul class="timeline">
        <li>
          <span class="tl-date">9月24日</span>
          <span class="tl-text">用 Trae 让 AI 生成了第一个网页</span>
        </li>
        <li>
          <span class="tl-date">9月23日</span>
          <span class="tl-text">第一次用 Git commit 存档代码</span>
        </li>
        <li>
          <span class="tl-date">9月21日</span>
          <span class="tl-text">网站上线，手机也能打开</span>
        </li>
      </ul>

      <h3 class="sub-title">技能</h3>
      <div class="skill-tags">
        <span class="tag">Python 基础</span>
        <span class="tag">HTML/CSS 入门</span>
        <span class="tag">Trae 工具使用</span>
        <span class="tag">有机化学实验操作</span>
      </div>
    </section>

    <section class="card project-card">
      <h2>项目</h2>
      <div class="project-item">
        <p class="project-name">我的作品集网站</p>
        <p class="project-desc">用 Trae 生成、Git 存档、Vercel 上线，人生第一个全链路作品</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>© 2026 Tom · 用 AI 学编程的第一步</p>
  </footer>
</body>
</html>
